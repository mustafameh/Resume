name: Compile Resume (PDF + DOCX)

on:
  push:
    branches: [main]
    paths: ["main.tex", "tex2docx.py", ".github/workflows/compile-pdf.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF output
        run: mv main.pdf resume.pdf

      - name: Setup pandoc
        uses: pandoc/actions/setup@v1

      - name: Convert to DOCX
        run: python3 tex2docx.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.pdf resume.docx
          git diff --cached --quiet || git commit -m "Auto-compile resume.pdf and resume.docx"
          git push
