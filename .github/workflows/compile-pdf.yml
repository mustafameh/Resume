name: Compile LaTeX to PDF

on:
  push:
    branches: [main]
    paths: ["main.tex"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename output
        run: mv main.pdf resume.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git diff --cached --quiet || git commit -m "Auto-compile resume.pdf"
          git push
